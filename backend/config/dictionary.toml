# Veri sözlüğü kaynağı (SQL Server).
#
# Sözlük hangi veritabanında ve hangi tablolarda olursa olsun, aşağıdaki sorguların mantıksal kolon
# adlarıyla (AS ...) sonuç döndürmesi yeterli. Kendi sözlüğünüze bağlarken sadece bu sorguları kendi
# tablo/kolon adlarınıza göre yeniden yazın. Varsayılan: scripts/seed_adventureworks_dictionary.py'nin
# oluşturduğu BI_Meta veritabanı (AdventureWorksDW2025 için Türkçe sözlük).
#
# source = "odbc"   -> sözlük ayrı bir veritabanında (odbc = "...")
# source = "data"   -> sözlük, veriyle aynı bağlantıda (SQLSERVER_ODBC)

source = "odbc"
odbc = "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;DATABASE=BI_Meta;Trusted_Connection=yes;TrustServerCertificate=yes;"
# Günlük anlık görüntü (daily snapshot) tarih kolonları: bu adlı kolonu olan tablo / view'larda her kayıt her gün
# için tekrarlanır (ör. EDWDM view'ları takvimle joinlenmiş, DataDate). Toplam / sayı alırken tek gün seçilmesi
# zorunlu tutulur; iki anlık görüntü birleştirilirken bu kolonlar da eşlenmeli. Boş liste: kontrol kapalı.
snapshot_date_columns = ["DataDate"]
# EDWDM'e özgü kurallar yalnız bu veritabanlarında geçerli (veri kaynağının veritabanı adı; boş liste = her veritabanı):
#   snapshot_databases      → günlük anlık görüntü (DataDate) koruması ve veri tarihi seçici
#   view_variant_databases  → ana view sözlükteyse Masked / PersonnelExcluded / PersonnelMasked varyantları da tanımlı
snapshot_databases = ["EDWDM"]
view_variant_databases = ["EDWDM"]
#   nolock_databases        → uygulamanın ürettiği sorgulara (filtre alt sorguları, seçenek listeleri) WITH (NOLOCK)
nolock_databases = ["EDWDM"]
# Kardinalitesi boş ilişkiler için veriden (unique index / COUNT DISTINCT) otomatik tespit
infer_cardinality = true

[queries]
# Zorunlu kolonlar: table_name (şema.tablo), business_name, description, subject_area, grain, row_count
# İsteğe bağlı: table_type (fact | dimension | bridge; boşsa ilişkilerden çıkarılır)
tables = """
SELECT table_name, business_name, description, subject_area, grain, row_count
FROM meta.dd_tables
"""

# Zorunlu: table_name, column_name, business_name, description, data_type,
#          column_role (measure|dimension|date|key|attribute), default_aggregation,
#          synonyms (virgülle ayrılmış), is_pii, sample_values
columns = """
SELECT table_name, column_name, business_name, description, data_type, column_role,
       default_aggregation, synonyms, is_pii, sample_values
FROM meta.dd_columns
"""

# Zorunlu: from_table, from_column, to_table, to_column
# İsteğe bağlı:
#   relationship_id — aynı id'li satırlar tek bir BİLEŞİK anahtar ilişkisidir (ör. FK constraint adı)
#   cardinality     — N:1 | 1:N | 1:1 | N:N  (boşsa veriden otomatik çıkarılır, bkz. infer_cardinality)
#   role            — aynı boyuta birden çok ilişki varsa anlamı (ör. "Sipariş tarihi", "Sevk tarihi")
#   is_active       — 1/0; filtreler yalnız aktif ilişkilerden yayılır (boşsa: aynı tablo çiftinde ilki aktif)
# İlişki tablonuz yoksa foreign key'lerden okuyabilirsiniz:
#   SELECT fk.name AS relationship_id, SCHEMA_NAME(tp.schema_id)+'.'+tp.name AS from_table, cp.name AS from_column,
#          SCHEMA_NAME(tr.schema_id)+'.'+tr.name AS to_table, cr.name AS to_column, NULL AS cardinality, NULL AS role, NULL AS is_active
#   FROM sys.foreign_keys fk JOIN sys.foreign_key_columns fkc ON fkc.constraint_object_id = fk.object_id
#   JOIN sys.tables tp ON tp.object_id = fkc.parent_object_id JOIN sys.columns cp ON cp.object_id = tp.object_id AND cp.column_id = fkc.parent_column_id
#   JOIN sys.tables tr ON tr.object_id = fkc.referenced_object_id JOIN sys.columns cr ON cr.object_id = tr.object_id AND cr.column_id = fkc.referenced_column_id
relationships = """
SELECT relationship_id, from_table, from_column, to_table, to_column, cardinality, role, is_active
FROM meta.dd_relationships
"""

# İsteğe bağlı (yoksa boş bırakın): metric_name, business_name, description,
#          expression_sql, base_table, value_format, synonyms
metrics = """
SELECT metric_name, business_name, description, expression_sql, base_table, value_format, synonyms
FROM meta.dd_metrics
"""
