# Rol bazlı veri erişim politikası. SQL doğrulayıcı her sorguyu buna göre kontrol eder.
# Gerçek ortamda rol AD/Entra ID grubundan eşlenir.

[roles.analyst]
allowed_schemas = ["dwh"]          # sadece bu şemalardaki tablolar sorgulanabilir
denied_tables = []                  # ör. ["dwh.fact_salary"]
allow_pii = false                   # sözlükte is_pii=true olan kolonlar engellenir
max_rows = 5000

[roles.admin]
allowed_schemas = ["dwh"]
denied_tables = []
allow_pii = true
max_rows = 20000

[sql]
# Hiçbir rol için izin verilmeyen fonksiyonlar (dosya/ağ erişimi, sistem bilgisi)
denied_functions = [
  "read_csv", "read_csv_auto", "read_parquet", "read_json", "read_json_auto", "read_text", "read_blob",
  "glob", "parquet_scan", "csv_scan", "sniff_csv", "httpfs", "getenv", "current_setting",
  "openrowset", "opendatasource", "openquery", "xp_cmdshell", "sp_executesql",
]
